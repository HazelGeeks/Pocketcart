name: EAS Native Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
          - preview-simulator
          - development

permissions:
  contents: read

jobs:
  eas-build:
    name: EAS ${{ inputs.platform }} ${{ inputs.profile }} build
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate GitHub secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "Missing GitHub secret: EXPO_TOKEN"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run release:native:check && npm run audit:ci
        env:
          # Compile-only web fixtures; the native build uses the EAS environment below.
          EXPO_NO_DOTENV: "1"
          EXPO_PUBLIC_SUPABASE_URL: https://preview.example.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder

      - name: Validate EAS production environment
        if: ${{ inputs.profile == 'production' || inputs.profile == 'preview' || inputs.profile == 'preview-simulator' }}
        run: |
          node scripts/eas-cli.mjs env:list production --format long > /tmp/pocketcart-eas-env.txt
          grep -q "EXPO_PUBLIC_SUPABASE_URL" /tmp/pocketcart-eas-env.txt || { echo "Missing EAS production env: EXPO_PUBLIC_SUPABASE_URL"; exit 1; }
          grep -q "EXPO_PUBLIC_SUPABASE_ANON_KEY" /tmp/pocketcart-eas-env.txt || { echo "Missing EAS production env: EXPO_PUBLIC_SUPABASE_ANON_KEY"; exit 1; }
          grep -q "EXPO_PUBLIC_AUTH_REDIRECT_URL" /tmp/pocketcart-eas-env.txt || { echo "Missing EAS production env: EXPO_PUBLIC_AUTH_REDIRECT_URL"; exit 1; }

      - name: Validate Android EAS production environment
        if: ${{ (inputs.profile == 'production' || inputs.profile == 'preview' || inputs.profile == 'preview-simulator') && (inputs.platform == 'android' || inputs.platform == 'all') }}
        run: |
          node scripts/eas-cli.mjs env:list production --format long > /tmp/pocketcart-eas-android-env.txt
          grep -q "POCKETCART_GOOGLE_MAPS_ANDROID_API_KEY" /tmp/pocketcart-eas-android-env.txt || { echo "Missing EAS production env: POCKETCART_GOOGLE_MAPS_ANDROID_API_KEY"; exit 1; }
          grep -q "GOOGLE_SERVICES_JSON" /tmp/pocketcart-eas-android-env.txt || { echo "Missing EAS production env: GOOGLE_SERVICES_JSON"; exit 1; }

      - name: Validate EAS development Firebase configuration
        if: ${{ inputs.profile == 'development' && (inputs.platform == 'android' || inputs.platform == 'all') }}
        run: |
          node scripts/eas-cli.mjs env:list development --format long > /tmp/pocketcart-eas-development-env.txt
          grep -q "GOOGLE_SERVICES_JSON" /tmp/pocketcart-eas-development-env.txt || { echo "Missing EAS development env: GOOGLE_SERVICES_JSON"; exit 1; }

      - name: Build native artifacts
        run: node scripts/eas-cli.mjs build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive
