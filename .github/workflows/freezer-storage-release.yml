name: Named Freezer Storage Backend Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: family-sharing-backend-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply named refrigerator and freezer storage
        run: node scripts/deploy-freezer-storage.mjs
