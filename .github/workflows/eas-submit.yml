name: EAS Store Submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store platform to submit
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
      profile:
        description: EAS submit profile
        required: true
        default: production
        type: choice
        options:
          - production

permissions:
  contents: read

jobs:
  eas-submit:
    name: EAS ${{ inputs.platform }} ${{ inputs.profile }} submit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run release:native:config-check && npm run release:store-assets:check

      - name: Submit latest native artifact
        run: npx eas-cli submit --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --latest --non-interactive
