name: EAS Store Submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store platform to submit
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
      profile:
        description: EAS submit profile
        required: true
        default: production
        type: choice
        options:
          - production
      build_id:
        description: Exact reviewed EAS build UUID to submit
        required: true
        type: string

permissions:
  contents: read

jobs:
  eas-submit:
    name: EAS ${{ inputs.platform }} ${{ inputs.profile }} submit
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate GitHub secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "Missing GitHub secret: EXPO_TOKEN"; exit 1; }

      - name: Validate exact submission target
        env:
          STORE_PLATFORM: ${{ inputs.platform }}
          EAS_BUILD_ID: ${{ inputs.build_id }}
        run: >-
          node --input-type=module -e 'import {submissionArgs} from "./scripts/submit-store.mjs";
          submissionArgs([process.env.STORE_PLATFORM, "--id", process.env.EAS_BUILD_ID]);'

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run release:native:check && npm run audit:ci && npm run release:store-assets:live-check
        env:
          # Compile-only web fixtures; never applied to the reviewed native artifact.
          EXPO_NO_DOTENV: "1"
          EXPO_PUBLIC_SUPABASE_URL: https://preview.example.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder

      - name: Validate EAS production environment
        run: |
          node scripts/eas-cli.mjs env:list production --format long > /tmp/pocketcart-eas-env.txt
          grep -q "EXPO_PUBLIC_SUPABASE_URL" /tmp/pocketcart-eas-env.txt || { echo "Missing EAS production env: EXPO_PUBLIC_SUPABASE_URL"; exit 1; }
          grep -q "EXPO_PUBLIC_SUPABASE_ANON_KEY" /tmp/pocketcart-eas-env.txt || { echo "Missing EAS production env: EXPO_PUBLIC_SUPABASE_ANON_KEY"; exit 1; }
          grep -q "EXPO_PUBLIC_AUTH_REDIRECT_URL" /tmp/pocketcart-eas-env.txt || { echo "Missing EAS production env: EXPO_PUBLIC_AUTH_REDIRECT_URL"; exit 1; }

      - name: Validate Android EAS production environment
        if: ${{ inputs.platform == 'android' }}
        run: |
          node scripts/eas-cli.mjs env:list production --format long > /tmp/pocketcart-eas-android-env.txt
          grep -q "POCKETCART_GOOGLE_MAPS_ANDROID_API_KEY" /tmp/pocketcart-eas-android-env.txt || { echo "Missing EAS production env: POCKETCART_GOOGLE_MAPS_ANDROID_API_KEY"; exit 1; }

      - name: Submit exact reviewed native artifact
        env:
          STORE_PLATFORM: ${{ inputs.platform }}
          EAS_BUILD_ID: ${{ inputs.build_id }}
        run: node scripts/submit-store.mjs "$STORE_PLATFORM" --id "$EAS_BUILD_ID" --non-interactive
