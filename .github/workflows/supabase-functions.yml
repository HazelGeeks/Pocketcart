name: Supabase Functions Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-account-functions:
    name: Deploy account functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Set account function secrets
        run: npx supabase secrets set SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy delete-account function
        run: npx supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy delete-account-request function
        run: npx supabase functions deploy delete-account-request --project-ref "$SUPABASE_PROJECT_ID"
