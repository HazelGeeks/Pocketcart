name: Mobile Release Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run native release checks
        run: npm run release:native:check
        env:
          # Compile-only fixtures: this workflow never deploys these artifacts.
          EXPO_NO_DOTENV: "1"
          EXPO_PUBLIC_SUPABASE_URL: https://preview.example.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder

      - name: Audit high severity dependencies
        run: npm run audit:ci
