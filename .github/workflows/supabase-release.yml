name: Supabase Backend Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: Plan is read-only; schema writes require reviewed migration versions
        type: choice
        default: plan
        options: [plan, apply-schema, record-existing, deploy-functions, release]
      migrations:
        description: Comma-separated 14-digit migration versions; never all
        type: string
        default: ''
      functions:
        description: All configured functions or comma-separated function names
        type: string
        default: all
      smoke:
        description: Optional live test creates/deletes disposable accounts after deployment
        type: choice
        default: none
        options: [none, family, alerts, receipts]

permissions:
  contents: read

concurrency:
  group: pocketcart-supabase-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate backend inventory and local plan
        run: npm run backend:plan
      - name: Check types, lint and tests
        run: npm run typecheck && npm run lint && npm run test
      - name: Audit dependency security
        run: npm run audit:ci
      - name: Validate optional smoke test credentials
        if: ${{ inputs.action != 'plan' && inputs.smoke != 'none' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Plan or deploy the selected backend changes
        env:
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_MIGRATIONS: ${{ inputs.migrations }}
          RELEASE_FUNCTIONS: ${{ inputs.functions }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          PUSH_FUNCTION_SECRET: ${{ secrets.PUSH_FUNCTION_SECRET }}
        shell: bash
        run: |
          args=("$RELEASE_ACTION" "--functions=$RELEASE_FUNCTIONS")
          if [[ -n "$RELEASE_MIGRATIONS" ]]; then args+=("--migrations=$RELEASE_MIGRATIONS"); fi
          if [[ "$RELEASE_ACTION" == plan ]]; then args+=(--remote); fi
          node scripts/supabase-release.mjs "${args[@]}"
      - name: Verify selected live user flow
        if: ${{ inputs.action != 'plan' && inputs.smoke != 'none' }}
        env:
          RELEASE_SMOKE: ${{ inputs.smoke }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          case "$RELEASE_SMOKE" in
            family) node scripts/test-live-family-sharing.mjs ;;
            alerts) node scripts/test-live-alert-plan.mjs ;;
            receipts) node scripts/test-live-receipts.mjs ;;
            *) exit 1 ;;
          esac
