name: Publish Reviewed Product Images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketcart-supabase-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate reviewed assets and release inventory
        run: node scripts/upload-reviewed-product-images.mjs validate && npm run backend:plan
      - name: Check types, lint, tests and dependency security
        run: npm run typecheck && npm run lint && npm run test && npm run audit:ci
      - name: Upload immutable reviewed photos and verify their public bytes
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/upload-reviewed-product-images.mjs upload
      - name: Apply the guarded image references
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/supabase-release.mjs apply-schema --migrations=20261009040000 --functions=back-office-flyer
